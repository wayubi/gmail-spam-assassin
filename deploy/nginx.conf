# Example reverse-proxy vhost for the web UI.
#
# This is a template. Replace example.com with your domain, copy it into your
# nginx conf.d directory, then reload nginx:
#
#   cp deploy/nginx.conf /etc/nginx/conf.d/spam-assassin.example.com.conf
#   nginx -t && nginx -s reload
#
# The API token is still required by every API call; this only publishes the
# page and the endpoints over HTTPS instead of the docker network.
#
# The container listens on 8080 and publishes no ports, so the proxy must share
# a docker network with it (see compose.override.yml).

server {
    listen 80;
    server_name spam-assassin.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name spam-assassin.example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Docker's embedded DNS, so the upstream is re-resolved when the container
    # is recreated with a new address.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $backend "http://gmail-spam-assassin:8080";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /run and the listing endpoints can block on IMAP for a while.
        proxy_read_timeout 300s;
        client_max_body_size 1m;
    }
}
